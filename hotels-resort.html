<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotels & Resorts - Petrichor Travels</title>

    <link rel="stylesheet" href="hotels-resort.css">
</head>

<body>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="bookings.html">Bookings</a></li>
            <li><a href="Flights.html">Flights</a></li>
            <li><a href="car-rental.html">Car Rental</a></li>
            <li><a href="hotels-resort.html">Hotels & Resorts</a></li>
        </ul>
    </nav>

    <h1>Hotels & Resorts</h1>

    <form>

        <label for="destination">Destination:</label>
        <input type="text" id="destination" name="destination" placeholder="Where do you want to stay?">

        <br>

        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin">

        <br>

        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout">

        <br>

        <label for="guests">Guests:</label>
        <input type="number" id="guests" name="guests" min="1" value="1">

        <br>
        <label for="rooms">Rooms:</label>
        <input type="number" id="rooms" name="rooms" min="1" value="1">

        <br>

        <label for="hotel">Hotel Type:</label>

        <select id="hotel" name="hotel">
            <option value="hotel">Hotel</option>
            <option value="resort">Resort</option>
            <option value="luxury">Luxury Hotel</option>
            <option value="budget">Budget Hotel</option>
        </select>

        <br>

        <button type="submit">Search Hotels</button>

    </form>

</body>

</html>
