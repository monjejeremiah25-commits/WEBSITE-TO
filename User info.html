<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="user-info.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <title>Petrichor Travels</title>
</head>

<body>
    <div class="container">
        <h1>User Information</h1>
        <p class="Poetic-text">Finish this, and step into a world where every horizon holds a new story.</p>
        <form action="Homepage.html">
            <h1>Personal Information</h1>
            
            <label for="First_Name">First Name:</label>
            <input type="text" id="First_Name" name="First_Name" required>
            
            <label for="Last_Name">Last Name:</label>
            <input type="text" id="Last_Name" name="Last_Name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="Phone_Number">Phone Number:</label>
            <input type="tel" id="Phone_Number" name="Phone_Number" required>
            
            <label for="Age">Age:</label>
            <select id="Age" name="Age">
                <option value="18-25">18-25</option>
                <option value="26-35">26-35</option>
                <option value="36-45">36-45</option>
                <option value="46-60">46-60</option>
                <option value="60+">60+</option>
            </select>
            
            <button type="submit" class="Userinfo-btn">Submit</button>
        </form>
    </div>

</body>

</html>
